<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 탐정 사무소 · 동수영중학교</title><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" media="print" onload="this.media='all'"><style>
/* 부스 키오스크(크롬북 1366×768 전체 화면 기준). 부스 벽면과 같은 남색·Q파랑·H주황·C초록·금색.
   전시장 조명 아래에서 읽히도록 밝은 화면 한 가지로 고정한다. */
:root{
  --navy:#17213A; --navy2:#22305A; --bg:#EEF1F6; --surface:#FFFFFF; --sunk:#F4F6FA; --ink:#17213A; --muted:#545F78; --line:#D5DBE6;
  --q:#2F5BD3; --q-soft:#E6EDFC; --h:#A35F06; --h-bg:#C9780C; --h-soft:#FCF0DC; --c:#1C805A; --c-soft:#E0F2E9;
  --gold:#F2B544; --gold-deep:#C98F17; --bad:#BF3A2F; --bad-soft:#FBE7E4; --on-ink:#FFFFFF;
  --font:"Pretendard Variable","Pretendard","Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:16px; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:anywhere}
.app{max-width:1260px;margin:0 auto;padding-block:10px 8px;display:flex;flex-direction:column;gap:12px;min-height:100vh}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--q);outline-offset:2px}

/* 상단 */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.mark{display:inline-flex;gap:3px;flex:none}
.mark i{font-style:normal;font-weight:900;width:30px;height:30px;display:grid;place-items:center;color:#fff;border-radius:7px;font-size:.95rem}
.mq{background:var(--q)} .mh{background:var(--h-bg)} .mc{background:var(--c)}
.brand b{display:block;font-size:1.05rem;line-height:1.25;font-weight:800}
.brand small{color:var(--muted);font-size:.8rem}
.steps{display:flex;gap:6px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.steps li{display:flex;align-items:center;gap:7px;padding:5px 13px 5px 6px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted);font-size:.88rem;font-weight:700;background:var(--surface)}
.steps li i{font-style:normal;font-weight:900;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--muted);font-size:.8rem}
.steps li.now.s-q{border-color:var(--q);color:var(--q);background:var(--q-soft)} .steps li.now.s-q i{background:var(--q);color:#fff}
.steps li.now.s-h{border-color:var(--h-bg);color:var(--h);background:var(--h-soft)} .steps li.now.s-h i{background:var(--h-bg);color:#fff}
.steps li.now.s-c{border-color:var(--c);color:var(--c);background:var(--c-soft)} .steps li.now.s-c i{background:var(--c);color:#fff}
.steps li.done{color:var(--ink)} .steps li.done i{background:var(--c);color:#fff}

#stage{flex:1;min-width:0}
.kicker{font-size:.8rem;font-weight:800;letter-spacing:.06em;color:var(--muted);margin:0}
h1{font-size:clamp(1.8rem,3.4vw,2.6rem);line-height:1.2;margin:.1em 0 .3em;text-wrap:balance;font-weight:900;letter-spacing:-.02em}
h2{font-size:1.28rem;line-height:1.35;margin:0 0 4px;display:flex;align-items:center;gap:10px;font-weight:800;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 12px;max-width:62ch}
.lead b{color:var(--ink)}
.small{font-size:.84rem;color:var(--muted)}
.badge{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;color:#fff;font-weight:900;flex:none}
.b-q{background:var(--q)} .b-h{background:var(--h-bg)} .b-c{background:var(--c)}

/* ===== 홈 ===== */
.home{display:flex;flex-direction:column;gap:14px}
.hero2{position:relative;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:center;
  background:var(--navy);color:#fff;border-radius:22px;padding:26px 32px;overflow:hidden;min-height:290px}
.hero2::before{content:"";position:absolute;inset:0;background:
  radial-gradient(520px 260px at 92% 20%,rgba(242,181,68,.20),transparent 70%),
  radial-gradient(420px 240px at 8% 110%,rgba(47,91,211,.35),transparent 70%);pointer-events:none}
.hcopy{position:relative;min-width:0}
.eyebrow{display:flex;align-items:center;gap:10px;margin:0 0 8px;font-weight:800;color:#C8D1E6;font-size:.92rem}
.eyebrow span{background:var(--gold);color:var(--navy);padding:3px 12px;border-radius:6px;font-weight:900}
.hero2 h1{color:#fff;font-size:clamp(2.2rem,4.4vw,3.3rem);margin:0 0 10px}
.hero2 .lead{color:#D5DCEC;font-size:1.02rem;margin:0 0 14px}
.hero2 .lead b{color:var(--gold)}
.qhcline{display:flex;gap:8px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.qhcline li{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:4px 14px 4px 5px;font-weight:700;font-size:.92rem}
.qhcline i{font-style:normal;font-weight:900;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff}
.qhcline .q{background:var(--q)} .qhcline .h{background:var(--h-bg)} .qhcline .c{background:var(--c)}
.hcards{position:relative;height:250px;min-width:0}
.samp{position:absolute;top:6px;width:178px;height:auto;aspect-ratio:4/5;border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.45);background:#22305A}
.samp.a{left:calc(50% - 190px);transform:rotate(-7deg)}
.samp.b{left:calc(50% + 4px);transform:rotate(6deg);top:0}
.ribbon{position:absolute;right:4%;bottom:0;background:var(--gold);color:var(--navy);font-weight:900;padding:7px 16px;border-radius:10px;box-shadow:0 6px 16px rgba(0,0,0,.35);transform:rotate(-3deg);font-size:.98rem}
@media (prefers-reduced-motion:no-preference){
  .samp.a{animation:floatA 6s ease-in-out infinite} .samp.b{animation:floatB 6s ease-in-out infinite}
  @keyframes floatA{50%{transform:rotate(-5deg) translateY(-6px)}}
  @keyframes floatB{50%{transform:rotate(8deg) translateY(-8px)}}
}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.level{text-align:left;cursor:pointer;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:0;display:flex;flex-direction:column;min-width:0;overflow:hidden;position:relative;transition:transform .15s,border-color .15s,box-shadow .15s}
.level:hover{border-color:var(--ink);transform:translateY(-2px);box-shadow:0 10px 24px rgba(23,33,58,.12)}
.level .thumb{display:block;height:118px;overflow:hidden;line-height:0;border-bottom:2px solid var(--line);background:#fff}
.level .thumb svg{width:100%;height:auto;display:block;margin-top:-18%}
.lvbody{display:flex;flex-direction:column;gap:2px;padding:12px 18px 14px}
.lvname{font-size:1.75rem;font-weight:900;line-height:1.1}
.lv0 .lvname{color:var(--c)} .lv1 .lvname{color:var(--q)} .lv2 .lvname{color:var(--h)}
.lvhow{font-weight:800;font-size:1.02rem}
.lvsub{color:var(--muted);font-size:.88rem}
.level .cta{position:absolute;right:14px;bottom:14px;background:var(--navy);color:#fff;padding:9px 18px;border-radius:10px;font-weight:800}
.today{margin:0;text-align:center;color:var(--muted);font-weight:700}
.today b{color:var(--navy);font-size:1.15em}

/* ===== Q·H·C 작업 화면 ===== */
.grid-a{display:grid;grid-template-columns:minmax(0,390px) minmax(0,1fr);gap:16px;align-items:start}
.evidence{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;position:sticky;top:10px;min-width:0}
.lvtag{margin:0 0 2px;font-size:.78rem;font-weight:800;letter-spacing:.04em;color:var(--h)}
.evidence h3{margin:0 0 4px;font-size:1.05rem;font-weight:900}
.scene{margin:6px 0;border-radius:12px;overflow:hidden;border:1.5px solid var(--line);background:#fff;line-height:0}
.scene svg{width:100%;height:auto;display:block}
.situ{margin:0;font-size:.92rem;line-height:1.45}
.evlist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.ev{background:var(--sunk);border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.9rem;line-height:1.4}
.evno{display:block;font-size:.74rem;font-weight:800;color:var(--h);letter-spacing:.02em}
.ev.hit{border-color:var(--bad);background:var(--bad-soft)}

.work{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:20px 22px;min-width:0}
.opts{display:grid;gap:9px;margin:6px 0 12px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{text-align:left;cursor:pointer;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:11px 16px;min-height:52px;width:100%;line-height:1.4;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .ql{display:block;font-size:.74rem;font-weight:800;color:var(--q);letter-spacing:.04em}
.opt.sel{border-color:var(--q);background:var(--q-soft)}
.opt.ok{border-color:var(--c);background:var(--c-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.go,.ghost{cursor:pointer;border-radius:12px;padding:11px 22px;min-height:52px;font-weight:800;display:inline-flex;align-items:center;gap:8px}
.go{border:0;background:var(--navy);color:#fff}
.go .k{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:rgba(255,255,255,.18);font-size:.8rem}
.go.gold{background:var(--gold);color:var(--navy);box-shadow:0 6px 16px rgba(201,143,23,.35)}
.go:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.ghost{background:transparent;border:2px solid var(--line)}
.ghost:hover{border-color:var(--ink)}
.danger{border-color:var(--bad);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}
.chat{display:grid;gap:9px;margin:6px 0 12px}
.msg{max-width:92%;padding:10px 14px;border-radius:14px;line-height:1.5;min-width:0}
.msg small{display:flex;align-items:center;gap:6px;font-size:.75rem;font-weight:800;color:var(--muted);margin-bottom:3px}
.msg.me{justify-self:end;background:var(--q-soft);border-bottom-right-radius:4px}
.msg.ai{justify-self:start;background:var(--sunk);border:1.5px solid var(--line);border-bottom-left-radius:4px}
.msg.wide{max-width:100%;width:100%}
.msg.ai .opt{margin-top:6px;background:var(--surface)}
.ava{width:18px;height:18px;border-radius:50%;background:var(--navy);position:relative;flex:none}
.ava::after{content:"";position:absolute;left:4px;top:4px;width:7px;height:7px;border:2px solid var(--gold);border-radius:50%}
.note{border-radius:10px;padding:9px 14px;margin:0 0 10px;font-size:.96rem;background:var(--h-soft)}
.note.good{background:var(--c-soft)} .note.bad{background:var(--bad-soft)}
.note.gap{margin-top:10px}
.explain .note{margin-bottom:8px}
.sub{font-weight:800;margin:12px 0 6px;font-size:1rem}
.picked{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--q-soft);border-radius:12px;padding:8px 12px;margin:8px 0 10px}
.picked span{font-size:.8rem;font-weight:800;color:var(--q)}
.picked b{flex:1;min-width:0}
label.lab{display:block;font-weight:700;margin:12px 0 6px;font-size:.92rem}
input[type=text],input[type=number],input[type=password],textarea,select{font:inherit;color:inherit;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
input[type=password]{letter-spacing:.2em}

/* ===== 발급 연출 ===== */
.reveal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(10,14,26,.78)}
.rv-card{width:300px;aspect-ratio:4/5;border-radius:20px;background:linear-gradient(150deg,#22305A,#17213A 60%);border:3px solid #3A4A78;display:grid;place-items:center;
  box-shadow:0 24px 60px rgba(0,0,0,.5);position:relative;overflow:hidden}
.rv-card::after{content:"";position:absolute;inset:-40%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.18) 50%,transparent 60%);transform:translateX(-60%)}
.rv-face{position:relative;z-index:1;display:grid;justify-items:center;gap:10px;color:#fff;text-align:center;padding:20px}
.rv-face b{font-size:1.5rem;font-weight:900}
.rv-face span{color:#C8D1E6;font-size:.95rem}
.rv-mark{display:flex;gap:4px}
.rv-mark i{font-style:normal;font-weight:900;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:1.3rem}
.rv-bar{width:180px;height:8px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}
.rv-bar i{display:block;height:100%;width:30%;background:var(--gold);border-radius:99px}
.rv-card.rare{background:linear-gradient(150deg,#4A3510,#1A1306 70%);border-color:var(--gold);box-shadow:0 0 0 6px rgba(242,181,68,.25),0 0 80px rgba(242,181,68,.55)}
.rv-card.rare .rv-face b{color:var(--gold)}
@media (prefers-reduced-motion:no-preference){
  .rv-card{animation:rvIn .35s ease-out}
  .rv-card::after{animation:shine 1.2s ease-in-out infinite}
  .rv-bar i{animation:load 1.4s ease-in-out infinite}
  .rv-card.rare{animation:wobble .5s ease-in-out 3}
  @keyframes rvIn{from{transform:scale(.85) rotate(-4deg);opacity:0}}
  @keyframes shine{to{transform:translateX(60%)}}
  @keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(340%)}}
  @keyframes wobble{25%{transform:rotate(-3deg) scale(1.03)}75%{transform:rotate(3deg) scale(1.03)}}
}
.confetti{position:fixed;inset:0;z-index:45;pointer-events:none;width:100%;height:100%}

/* ===== 완료 ===== */
.done{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:20px;align-items:start}
.cardwrap{position:relative}
.cardwrap canvas{width:100%;height:auto;display:block;border-radius:16px;box-shadow:0 14px 34px rgba(23,33,58,.25);background:#E8ECF2}
.done.is-rare .cardwrap canvas{box-shadow:0 0 0 4px var(--gold),0 18px 44px rgba(201,143,23,.45)}
.donehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.donehead h2{font-size:1.4rem}
.num{font-variant-numeric:tabular-nums;color:var(--c);letter-spacing:.02em}
.themeline{margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gr{font-weight:900;font-size:.8rem;padding:3px 10px;border-radius:999px}
.gr-sp{background:var(--navy);color:#fff} .gr-rare{background:var(--gold);color:var(--navy)}
.rarebanner{display:flex;flex-direction:column;gap:2px;background:linear-gradient(100deg,#2A1E06,#6B4A0E 55%,#2A1E06);color:#FFE9A8;border-radius:12px;padding:11px 16px;margin:10px 0 0;border:2px solid var(--gold)}
.rarebanner b{font-size:1.25rem;color:#FFD772}
.qrbox{display:flex;gap:18px;align-items:center;background:var(--sunk);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0 6px}
.qrbox canvas{width:168px;height:168px;image-rendering:pixelated;border-radius:8px;background:#fff;flex:none}
.qrtext{min-width:0}
.qrtext ol{margin:4px 0 6px;padding-left:1.2em;display:grid;gap:2px}
.staff{margin-top:14px;border:2px dashed var(--line);border-radius:14px;padding:10px 14px;background:#FBFCFE}
.stafft{margin:0 0 4px;font-size:.74rem;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.staffrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.souv{font-weight:700;padding:5px 12px;border-radius:999px}
.souv.key{background:var(--c-soft)} .souv.stk{background:var(--h-soft)}
.gifted{margin:8px 0 0;font-weight:800;color:var(--c)}
.hold{position:relative;overflow:hidden;width:100%;margin-top:8px;cursor:pointer;border:2px solid var(--gold-deep);background:#FFF7E6;border-radius:12px;min-height:50px;padding:10px 16px;font-weight:700;user-select:none;-webkit-user-select:none;touch-action:none}
.hold .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--gold)}
.hold .lbl{position:relative}
.hold.holding .fill{width:100%;transition:width 2s linear}
.camwrap{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:4/3;max-width:100%;max-height:520px;margin:0 auto}
.camwrap video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.camwrap .guide{position:absolute;inset:12% 30%;border:3px dashed rgba(255,255,255,.8);border-radius:40% 40% 30% 30%}
.camwrap .count{position:absolute;inset:0;display:grid;place-items:center;font-size:6rem;font-weight:800;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.narrow{max-width:760px;margin:0 auto}
ul.plain{padding-left:1.2em;display:grid;gap:4px}

/* ===== 바닥글·오버레이 ===== */
footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.foot{background:none;border:0;color:inherit;padding:4px 0;cursor:default;font-size:.78rem}
.footr{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.gear{background:transparent;border:1.5px solid var(--line);border-radius:999px;color:var(--muted);padding:3px 12px;font-size:.78rem;font-weight:700;cursor:pointer;min-height:30px}
.gear:hover{border-color:var(--ink);color:var(--ink)}
.overlay{position:fixed;inset:0;background:rgba(10,14,22,.55);display:grid;place-items:center;padding:16px;z-index:50}
.panel{background:var(--surface);color:var(--ink);border-radius:16px;padding:20px 22px;width:min(580px,100%);max-height:92vh;overflow:auto}
.panel.wide{width:min(980px,100%)}
.narrowp{width:min(420px,100%)}
.panel h2{margin-bottom:8px}

/* 관리 화면 */
.admhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.admhead h2{margin:0;flex:1;min-width:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px;border-bottom:2px solid var(--line)}
.tabs button{cursor:pointer;border:0;background:none;padding:9px 14px;font-weight:800;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.sel{color:var(--navy);border-bottom-color:var(--navy)}
.tabbody{padding-top:8px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--sunk);border-radius:12px;padding:10px 14px}
.kpi span{display:block;font-size:.8rem;color:var(--muted);font-weight:700}
.kpi b{font-size:1.7rem;font-weight:900;font-variant-numeric:tabular-nums}
.kpi b small{font-size:.9rem;color:var(--muted);font-weight:700}
.kpi.gold{background:#FFF4DB}
.bars{display:flex;gap:8px;align-items:flex-end;height:120px;padding:4px 0 0}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;gap:2px}
.bar i{display:block;width:100%;max-width:46px;background:var(--q);border-radius:6px 6px 2px 2px;min-height:2px}
.bar b{font-size:.8rem;font-variant-numeric:tabular-nums;order:-1}
.bar span{font-size:.75rem;color:var(--muted)}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:4px}
.slot{background:var(--sunk);border-radius:10px;padding:8px 12px;border:2px solid transparent}
.slot.cur{border-color:var(--c);background:var(--c-soft)}
.slot span{display:block;font-size:.8rem;color:var(--muted)}
.slot b{font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--sunk);border-radius:10px;padding:9px 12px;font-size:.84rem;color:var(--muted)}
.stat b{display:block;font-size:1.2rem;color:var(--ink);font-variant-numeric:tabular-nums}
.check{display:flex;gap:10px;align-items:center;margin:12px 0;font-weight:700}
.check input{width:22px;height:22px;flex:none}

  function confetti(rare) {
    if (reduced()) return;
    var run = ++confettiRun;
    var cv = $('confetti'), x = cv.getContext('2d'), W = cv.width = window.innerWidth, H = cv.height = window.innerHeight;
    var cols = rare ? ['#F2B544', '#FFE08A', '#C9780C', '#FFFFFF', '#FF7EB6', '#6FD3FF'] : ['#2F5BD3', '#C9780C', '#1C805A', '#F2B544'];
    var P = [], n = rare ? 160 : 70;
    for (var i = 0; i < n; i++) P.push({ x: W * (0.25 + Math.random() * 0.5), y: H * 0.35, vx: (Math.random() - 0.5) * 14, vy: -6 - Math.random() * 10, r: 4 + Math.random() * 6, a: Math.random() * 6, va: (Math.random() - 0.5) * 0.4, c: cols[i % cols.length] });
    var t0 = performance.now(); cv.hidden = false;

        x.save(); x.globalAlpha = Math.max(0, 1 - k / 2.4); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); x.restore(); });

    })(t0);

    h += '<p class="small">행사 전날 시험해 본 기록은 "시험 기록 모두 지우기"로 지우세요. 당첨 상품 수와 하루 목표도 처음 값으로 돌아가요. (이 기기 기록 ' + mine.length + '건)</p>';
    return h;
  }
  function openAdmin(msg) {
    var tabs = [['now', '오늘 현황'], ['prize', '당첨 설정'], ['set', '기기·운영 설정'], ['log', '기록']];
    var h = '<div class="panel wide" role="dialog" aria-labelledby="admT"><div class="admhead"><h2 id="admT">관리 화면 · 기기 ' + esc(dev()) + '</h2><span class="small">' + esc(today()) + ' ' + esc(hhmmss().slice(0, 5)) + '</span>' +
      '<button type="button" class="ghost sm" data-adm="close">닫기</button></div>';
    h += '<div class="tabs" role="tablist">' + tabs.map(function (t) { return '<button type="button" role="tab" aria-selected="' + (tab === t[0]) + '" class="' + (tab === t[0] ? 'sel' : '') + '" data-adm="tab" data-v="' + t[0] + '">' + t[1] + '</button>'; }).join('') + '</div>';
    h += '<div class="tabbody">' + { now: tabNow, prize: tabPrize, set: tabSet, log: tabLog }[tab]() + '</div>';
    h += '<p class="small" id="admMsg" aria-live="polite">' + esc(msg || '') + '</p></div>';
    $('admin').innerHTML = h; $('admin').hidden = false;
  }
  function setLeft(n) {
    n = Math.max(0, Math.min(99, n)); var was = rareLeft(); sset('qhc_rare_left', n);
    var m = sget('qhc_daystart', {}), t = today(); m[t] = n + logsToday().filter(function (l) { return l.grade === '당첨'; }).length; sset('qhc_daystart', m);
    if (n === 0) { sset('qhc_rare_on', false); sset('qhc_rare_auto_off', true); sset('qhc_force', false); }
    else if (was === 0 && sget('qhc_rare_auto_off', false)) { sset('qhc_rare_on', true); sset('qhc_rare_auto_off', false); }
    openAdmin('남은 상품을 ' + n + '개로 바꿨어요.');
  }
  function download(name, text) {
    var url = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
    var a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
  }
  $('admin').addEventListener('click', function (e) {
    var b = e.target.closest('[data-adm]'); if (!b || b.disabled) return;
    var k = b.getAttribute('data-adm'), msg = $('admMsg');
    if (k === 'close') { $('admin').hidden = true; clearArm = ''; render(); return; }
    if (k === 'pinOk') {
      if (($('pinIn').value || '').trim() === pin()) { clearArm = ''; tab = 'now'; openAdmin(); }
      else { $('pinIn').value = ''; $('pinMsg').textContent = '비밀번호가 맞지 않아요.'; $('pinIn').focus(); }
      return;
    }
    if (k === 'tab') { tab = b.getAttribute('data-v'); clearArm = ''; openAdmin(); return; }
    if (k === 'save') {
      var op = $('openIn').value.trim(), cl = $('closeIn').value.trim();
      if (minOf(op) == null || minOf(cl) == null || minOf(cl) <= minOf(op)) { msg.textContent = '운영 시간은 10:00, 17:30처럼 넣어 주세요. 끝 시간이 시작보다 늦어야 해요.'; return; }
      var ds = $('daysIn').value.split(/[,\s]+/).filter(Boolean);
      if (!ds.length || ds.some(function (d) { return !/^\d{4}-\d{2}-\d{2}$/.test(d); })) { msg.textContent = '날짜는 2026-12-18처럼 넣어 주세요.'; return; }
      var kd = parseInt($('keyIn').value, 10); if (isNaN(kd) || kd < 0) { msg.textContent = '하루 키링 수를 숫자로 넣어 주세요.'; return; }
      var np = ($('pinNew').value || '').trim();
      if (np && !/^[0-9]{4,8}$/.test(np)) { msg.textContent = '비밀번호는 숫자 4~8자리로 넣어 주세요.'; return; }
      sset('qhc_dev', $('devsel').value); sset('qhc_phone_url', $('purl').value.trim()); sset('qhc_cam', $('camchk').checked);
      sset('qhc_open', op); sset('qhc_close', cl); sset('qhc_days', ds.sort()); sset('qhc_key_daily', kd);
      if (np) sset('qhc_pin', np);
      openAdmin('저장했어요.'); return;
    }
    if (k === 'rLeft') { setLeft(rareLeft() + parseInt(b.getAttribute('data-d'), 10)); return; }
    if (k === 'rLeftSet') { var nv = parseInt($('rLeftIn').value, 10); if (isNaN(nv)) { msg.textContent = '숫자를 넣어 주세요.'; return; } setLeft(nv); return; }
    if (k === 'mode') { sset('qhc_rare_mode', b.getAttribute('data-v')); openAdmin(b.getAttribute('data-v') === 'auto' ? '자동 조절로 바꿨어요.' : '고정 확률로 바꿨어요.'); return; }
    var setP = function (v) { v = Math.round(Math.max(0, Math.min(100, v)) * 10) / 10; sset('qhc_rare_p', v); openAdmin('고정 확률을 ' + v + '%로 바꿨어요.'); };
    if (k === 'rP') { setP(parseFloat(b.getAttribute('data-v'))); return; }
    if (k === 'rPSet') { var pv = parseFloat($('rPIn').value); if (isNaN(pv)) { msg.textContent = '숫자를 넣어 주세요.'; return; } setP(pv); return; }
    if (k === 'force') { var f = !sget('qhc_force', false); if (f && !(rareOn() && rareLeft() > 0)) { msg.textContent = '당첨이 꺼져 있거나 상품이 없어요.'; return; } sset('qhc_force', f); openAdmin(f ? '다음 체험자 1명이 당첨돼요.' : '예약을 취소했어요.'); return; }
    if (k === 'rToggle') {
      if (rareOn() && rareLeft() > 0) { sset('qhc_rare_on', false); sset('qhc_rare_auto_off', false); sset('qhc_force', false); openAdmin('당첨을 껐어요.'); return; }
      if (rareLeft() <= 0) { msg.textContent = '남은 상품이 0개예요. 상품 수를 먼저 넣어 주세요.'; return; }
      sset('qhc_rare_on', true); openAdmin('당첨을 켰어요.'); return;
    }
    if (k === 'gift') {
      var no = b.getAttribute('data-no'), t0 = today(), tm = hhmmss();
      updateLog(no, t0, function (l) { l.gift = !l.gift; l.giftTime = l.gift ? tm : ''; }); openAdmin(); return;
    }
    if (k === 'csv') {
      try { download('QHC_체험기록_' + dev() + '_' + today() + '.csv', csv(allLogs())); msg.textContent = '내려받기를 시작했어요. 파일이 생기지 않으면 CSV 복사를 쓰세요.'; }
      catch (err) { msg.textContent = '내려받을 수 없어요. CSV 복사를 쓰세요.'; }
      return;
    }
    if (k === 'copy') {
      var box = $('csvbox'), text = csv(allLogs()).replace(/^﻿/, ''); box.value = text; box.hidden = false;
      var sel = function () { box.focus(); box.select(); msg.textContent = '칸 안의 내용을 복사해 스프레드시트에 붙여 넣으세요.'; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { msg.textContent = '복사했어요. 스프레드시트에 붙여 넣으세요.'; }, sel); else sel();
      return;
    }
    if (k === 'fs') { var el = document.documentElement; if (el.requestFullscreen) el.requestFullscreen().catch(function () { msg.textContent = '전체 화면을 켤 수 없어요. 키보드의 전체 화면 키를 눌러 주세요.'; }); else msg.textContent = '키보드의 전체 화면 키를 눌러 주세요.'; return; }
    if (k === 'clearToday') {
      if (clearArm !== 'today') { clearArm = 'today'; openAdmin(); return; }
      var t = today(); sset('qhc_logs', allLogs().filter(function (l) { return l.date !== t; })); clearArm = ''; openAdmin('오늘 기록을 지웠어요.'); return;
    }
    if (k === 'clearAll') {
      if (clearArm !== 'all') { clearArm = 'all'; openAdmin(); return; }
      sset('qhc_logs', []); ['qhc_rare_on', 'qhc_rare_left', 'qhc_rare_auto_off', 'qhc_rare_mode', 'qhc_rare_p', 'qhc_daystart', 'qhc_dayseen', 'qhc_force', 'qhc_lastcase'].forEach(function (x) { try { localStorage.removeItem(x); } catch (er) {} delete MEM[x]; });
      clearArm = ''; openAdmin('모든 기록을 지우고 당첨 설정을 처음 값(상품 ' + DEF.rareLeft + '개, 자동 조절)으로 돌렸어요.'); return;
    }
  });

  fresh(); daySeen(); render();
  window.__QHC_TEST__ = { rareInfo: rareInfo, keyInfo: keyInfo, pickGrade: pickGrade };
})();
</script>
</body></html>
