/* 한 줄 세로 흐름: 신분증 미리보기 → 별명 → 셀카 → 저장 */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --ink:#17213A; --muted:#566079; --line:#D3D9E4;
  --q:#2F5BD3; --c:#1C805A; --c-soft:#E0F2E9; --bad-soft:#FBE6E3; --on-ink:#FFFFFF;

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141C; --surface:#18202D; --ink:#E7ECF5; --muted:#9BA6BB; --line:#2B3547;
  --q:#86A6FF; --c:#55C892; --c-soft:#15342A; --bad-soft:#3E1F1C; --on-ink:#0F141C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141C; --surface:#18202D; --ink:#E7ECF5; --muted:#9BA6BB; --line:#2B3547;
  --q:#86A6FF; --c:#55C892; --c-soft:#15342A; --bad-soft:#3E1F1C; --on-ink:#0F141C; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:520px;margin:0 auto;padding-block:18px 28px;display:grid;gap:14px}
.kicker{font-size:.8rem;font-weight:800;letter-spacing:.08em;color:var(--muted);margin:0}
h1{font-size:1.45rem;line-height:1.3;margin:2px 0 0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted);font-size:.9rem}
#card{width:100%;height:auto;display:block;border-radius:14px;border:1.5px solid var(--line);background:#E8ECF2}
#final{width:100%;height:auto;display:block;border-radius:14px;border:2px solid var(--c);-webkit-touch-callout:default}
label.lab{font-weight:700;font-size:.95rem;display:block;margin-bottom:6px}
input[type=text]{font:inherit;color:inherit;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
.btn{display:flex;align-items:center;justify-content:center;font:inherit;font-weight:800;border-radius:12px;padding:14px 18px;min-height:54px;cursor:pointer;text-align:center;width:100%}
.btn.main{background:var(--ink);color:var(--on-ink);border:0}
.btn.sub{background:transparent;color:var(--ink);border:2px solid var(--line)}
.note{border-radius:10px;padding:11px 14px;background:var(--c-soft);font-size:.95rem}
.note.bad{background:var(--bad-soft)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--q);outline-offset:2px}
.theme{margin-top:6px;font-size:.95rem;color:var(--muted)}
.theme b{color:var(--ink)}
.rare{display:inline-block;background:#E8B526;color:#3A2806;font-weight:800;border-radius:999px;padding:1px 10px;font-size:.85rem}

  function goldGrad(x, x0, y0, x1, y1) {

    g.addColorStop(0, '#8A6418'); g.addColorStop(0.25, '#F7DC7A'); g.addColorStop(0.5, '#B8892A'); g.addColorStop(0.75, '#FFF1B8'); g.addColorStop(1, '#9C7420');
    return g;
  }
  function rainbow(x, x0, y0, x1, y1) {
    var g = x.createLinearGradient(x0, y0, x1, y1);
    ['#FF7EB6', '#FFB86B', '#FFE66B', '#7EE8B0', '#6FD3FF', '#9C8CFF', '#FF7EB6'].forEach(function (c, i, a) { g.addColorStop(i / (a.length - 1), c); });
    return g;
  }
  function magnifier(x, cx, cy, r, ring, glass) {
    x.save(); x.lineCap = 'round';
    x.strokeStyle = ring; x.lineWidth = r * 0.42; x.beginPath(); x.moveTo(cx + r * 0.72, cy + r * 0.72); x.lineTo(cx + r * 1.75, cy + r * 1.75); x.stroke();
    x.fillStyle = glass; x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill();
    x.lineWidth = r * 0.2; x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.stroke();
    x.restore();
  }
  function pill(x, text, cx, cy, fill, ink, stroke) {
    x.font = '800 26px ' + FONT; var w = x.measureText(text).width + 44;
    rr(x, cx, cy, w, 46, 23);
    if (fill) { x.fillStyle = fill; x.fill(); }
    if (stroke) { x.strokeStyle = stroke; x.lineWidth = 2.5; x.stroke(); }
    x.fillStyle = ink; x.textAlign = 'left'; x.fillText(text, cx + 22, cy + 32);
    return w;
  }

  /* ---------- 테마별 장식 ---------- */
  var DECO = {
    noir: {
      ink: '#1A2036', sub: '#7A705A', line: '#E0D5BC', stamp: '#9E2B25', rank: '#7A5A10', shape: 'rect',
      bg: function (x) {
        x.fillStyle = '#121933'; x.fillRect(0, 0, W, H);
        x.strokeStyle = 'rgba(233,200,115,.07)'; x.lineWidth = 2;
        for (var i = 0; i < 40; i++) { var a = Math.PI * (i / 40); x.beginPath(); x.moveTo(W / 2, H + 40); x.lineTo(W / 2 + Math.cos(a) * 1600, H + 40 - Math.sin(a) * 1600); x.stroke(); }
      },
      card: function (x, T) {
        x.fillStyle = '#F5EFE2'; rr(x, 44, 44, W - 88, H - 88, 30); x.fill();
        x.save(); rr(x, 44, 44, W - 88, H - 88, 30); x.clip();
        x.fillStyle = '#121933'; x.fillRect(44, 44, W - 88, 210);
        x.strokeStyle = '#C9A24A'; x.lineWidth = 3; x.beginPath(); x.moveTo(44, 248); x.lineTo(W - 44, 248); x.moveTo(44, 256); x.lineTo(W - 44, 256); x.stroke();
        x.restore();
        // 아르데코 모서리
        x.strokeStyle = '#C9A24A'; x.lineWidth = 3;
        [[70, 282, 1, 1], [W - 70, 282, -1, 1], [70, H - 70, 1, -1], [W - 70, H - 70, -1, -1]].forEach(function (c) {
          x.beginPath(); x.moveTo(c[0], c[1] + c[3] * 60); x.lineTo(c[0], c[1]); x.lineTo(c[0] + c[2] * 60, c[1]);
          x.moveTo(c[0] + c[2] * 12, c[1] + c[3] * 40); x.lineTo(c[0] + c[2] * 12, c[1] + c[3] * 12); x.lineTo(c[0] + c[2] * 40, c[1] + c[3] * 12); x.stroke();
        });
        pill(x, '특별 등급', 96, 76, null, '#E9C873', '#C9A24A');
        x.fillStyle = '#E9C873'; x.font = '800 64px ' + SERIF; x.fillText(T.title, 96, 196);
        x.strokeStyle = '#C9A24A'; x.lineWidth = 2; x.beginPath(); x.arc(W - 170, 150, 72, 0, Math.PI * 2); x.stroke();
        x.beginPath(); x.arc(W - 170, 150, 62, 0, Math.PI * 2); x.stroke();
        magnifier(x, W - 182, 138, 30, '#E9C873', 'rgba(233,200,115,.15)');
      },
      frame: function (x, clip) { x.strokeStyle = '#C9A24A'; x.lineWidth = 6; clip(); x.stroke(); x.lineWidth = 2; x.strokeRect(84, 278, 344, 414); }
    },
    file: {
      ink: '#3B2A16', sub: '#86693A', line: '#C9AE73', stamp: '#B3261E', rank: '#8A2B12', shape: 'polaroid',
      bg: function (x, R) {
        x.fillStyle = '#2A2A2D'; x.fillRect(0, 0, W, H);
        for (var i = 0; i < 900; i++) { x.fillStyle = 'rgba(255,255,255,' + (R() * 0.05).toFixed(3) + ')'; x.fillRect(R() * W, R() * H, 2, 2); }
      },
      card: function (x, T) {
        // 서류철 탭 + 본체
        x.save(); x.shadowColor = 'rgba(0,0,0,.35)'; x.shadowBlur = 24; x.shadowOffsetY = 8;
        x.fillStyle = '#D9BF84';
        x.beginPath(); x.moveTo(60, 120); x.lineTo(60, 64); x.quadraticCurveTo(60, 40, 84, 40); x.lineTo(380, 40); x.quadraticCurveTo(400, 40, 410, 60); x.lineTo(430, 100); x.lineTo(W - 60, 100); x.lineTo(W - 60, H - 44); x.lineTo(60, H - 44); x.closePath(); x.fill();
        x.restore();
        x.fillStyle = '#E8D3A2'; x.fillRect(60, 100, W - 120, H - 144);
        x.fillStyle = '#5A4422'; x.font = '800 24px ' + FONT; x.fillText('CASE FILE · 사건 파일', 92, 82);
        // 증거 테이프
        x.save(); x.translate(W - 210, 150); x.rotate(0.42);
        x.fillStyle = '#F2C230'; x.fillRect(-260, -26, 520, 52);
        x.fillStyle = '#1D1D1D'; for (var s = -260; s < 260; s += 44) { x.beginPath(); x.moveTo(s, -26); x.lineTo(s + 22, -26); x.lineTo(s + 4, 26); x.lineTo(s - 18, 26); x.fill(); }
        x.fillStyle = '#F2C230'; x.fillRect(-150, -18, 300, 36);
        x.fillStyle = '#1D1D1D'; x.font = '800 22px ' + FONT; x.textAlign = 'center'; x.fillText('EVIDENCE · 증거 확인', 0, 8); x.textAlign = 'left';
        x.restore();
        pill(x, '특별 등급', 96, 128, null, '#5A4422', '#8A6B35');
        x.fillStyle = '#3B2A16'; x.font = '800 62px ' + SERIF; x.fillText(T.title, 96, 238);
        x.strokeStyle = '#B3261E'; x.lineWidth = 3; x.beginPath(); x.moveTo(96, 262); x.lineTo(W - 96, 262); x.stroke();
      },
      frame: function () {}
    },
    gold: {
      ink: '#F6E7B8', sub: '#B59A5A', line: 'rgba(232,190,90,.35)', stamp: '#E4B94A', rank: '#FFD772', shape: 'arch',
      bg: function (x, R) {
        x.fillStyle = '#0B0906'; x.fillRect(0, 0, W, H);
        x.save(); x.translate(W / 2, 470); x.fillStyle = 'rgba(232,190,90,.07)';
        for (var i = 0; i < 28; i++) { x.rotate(Math.PI * 2 / 28); x.beginPath(); x.moveTo(0, 0); x.lineTo(-46, 1300); x.lineTo(46, 1300); x.closePath(); x.fill(); }
        x.restore();
        x.fillStyle = 'rgba(255,230,150,.8)'; for (var k = 0; k < 18; k++) sparkle(x, R() * W, R() * H, 6 + R() * 10);
      },
      card: function (x, T) {
        x.fillStyle = '#15120C'; rr(x, 44, 44, W - 88, H - 88, 36); x.fill();
        x.strokeStyle = goldGrad(x, 0, 0, W, H); x.lineWidth = 12; rr(x, 50, 50, W - 100, H - 100, 32); x.stroke();
        x.lineWidth = 2; rr(x, 72, 72, W - 144, H - 144, 22); x.stroke();
        pill(x, '★ 당첨 신분증', 96, 96, goldGrad(x, 96, 96, 330, 142), '#2A1E06', null);
        x.fillStyle = goldGrad(x, 96, 150, 700, 230); x.font = '800 68px ' + SERIF; x.fillText(T.title, 96, 226);
        // 왕관 + 별
        var cx = W - 170, cy = 150; x.fillStyle = goldGrad(x, cx - 70, cy - 50, cx + 70, cy + 40);
        x.beginPath(); x.moveTo(cx - 66, cy + 34); x.lineTo(cx - 72, cy - 28); x.lineTo(cx - 34, cy + 2); x.lineTo(cx, cy - 48); x.lineTo(cx + 34, cy + 2); x.lineTo(cx + 72, cy - 28); x.lineTo(cx + 66, cy + 34); x.closePath(); x.fill();
        x.fillRect(cx - 66, cy + 40, 132, 12);
        x.fillStyle = '#7A0E12'; [-36, 0, 36].forEach(function (d) { x.beginPath(); x.arc(cx + d, cy + 18, 7, 0, Math.PI * 2); x.fill(); });
        x.strokeStyle = 'rgba(232,190,90,.4)'; x.lineWidth = 2; x.beginPath(); x.moveTo(96, 262); x.lineTo(W - 96, 262); x.stroke();
      },
      frame: function (x, clip, px, py, pw, ph) {
        x.strokeStyle = goldGrad(x, px, py, px + pw, py + ph); x.lineWidth = 9; clip(); x.stroke();
        x.fillStyle = goldGrad(x, px - 60, py, px + pw + 60, py + ph);
        for (var lf = 0; lf < 8; lf++) {
          var a = Math.PI * 0.62 + lf * 0.2;
          [-1, 1].forEach(function (s) {
            x.save(); x.translate(px + pw / 2 + s * Math.cos(a) * 190, py + ph / 2 + 30 + Math.sin(a) * 220); x.rotate(s * (a - 0.3)); x.beginPath(); x.ellipse(0, 0, 10, 24, 0, 0, Math.PI * 2); x.fill(); x.restore();
          });
        }
      }
    },
    prism: {
      ink: '#2A1E52', sub: '#6E6196', line: 'rgba(110,97,150,.25)', stamp: '#7A4CE0', rank: '#7A4CE0', shape: 'arch',
      bg: function (x, R) {
        x.fillStyle = '#140E2B'; x.fillRect(0, 0, W, H);
        [['rgba(255,126,182,.45)', 160, 220], ['rgba(111,211,255,.40)', 920, 520], ['rgba(156,140,255,.45)', 300, 1150]].forEach(function (b) {
          var g = x.createRadialGradient(b[1], b[2], 0, b[1], b[2], 520); g.addColorStop(0, b[0]); g.addColorStop(1, 'rgba(20,14,43,0)'); x.fillStyle = g; x.fillRect(0, 0, W, H);
        });
        x.fillStyle = 'rgba(255,255,255,.85)'; for (var k = 0; k < 22; k++) sparkle(x, R() * W, R() * H, 4 + R() * 9);
      },
      card: function (x, T, R) {
        x.save(); rr(x, 44, 44, W - 88, H - 88, 40); x.clip();
        var g = x.createLinearGradient(44, 44, W - 44, H - 44);
        ['#FFD6EF', '#C9F1FF', '#E4D6FF', '#FFF0C6', '#D4FFEA', '#FFD6EF'].forEach(function (c, i, a) { g.addColorStop(i / (a.length - 1), c); });
        x.fillStyle = g; x.fillRect(0, 0, W, H);
        x.globalAlpha = 0.35; x.fillStyle = '#FFFFFF';
        [[-200, 0], [260, 0], [620, 0]].forEach(function (s) { x.beginPath(); x.moveTo(s[0], H); x.lineTo(s[0] + 120, H); x.lineTo(s[0] + 920, 0); x.lineTo(s[0] + 800, 0); x.fill(); });
        x.globalAlpha = 1; x.fillStyle = 'rgba(255,255,255,.9)'; for (var k = 0; k < 16; k++) sparkle(x, 60 + R() * (W - 120), 60 + R() * 200, 5 + R() * 8);
        x.restore();
        x.strokeStyle = rainbow(x, 0, 0, W, H); x.lineWidth = 6; rr(x, 47, 47, W - 94, H - 94, 38); x.stroke();
        x.fillStyle = 'rgba(255,255,255,.80)'; rr(x, 76, 276, W - 152, H - 352, 28); x.fill();
        pill(x, '★ 당첨 신분증', 96, 96, rainbow(x, 96, 96, 330, 142), '#2A1E52', null);
        x.fillStyle = '#2A1E52'; x.font = '800 64px ' + SERIF; x.fillText(T.title, 96, 222);
        // 프리즘
        var cx = W - 180, cy = 150;
        ['#FF7EB6', '#FFB86B', '#FFE66B', '#7EE8B0', '#6FD3FF', '#9C8CFF'].forEach(function (c, i) {
          x.strokeStyle = c; x.lineWidth = 6; x.beginPath(); x.moveTo(cx + 18, cy + 4); x.lineTo(cx + 110, cy - 20 + i * 12); x.stroke();
        });
        x.strokeStyle = '#FFFFFF'; x.lineWidth = 5; x.beginPath(); x.moveTo(cx - 130, cy + 10); x.lineTo(cx - 20, cy - 2); x.stroke();
        x.fillStyle = 'rgba(255,255,255,.75)'; x.strokeStyle = '#2A1E52'; x.lineWidth = 4;
        x.beginPath(); x.moveTo(cx, cy - 56); x.lineTo(cx + 52, cy + 40); x.lineTo(cx - 52, cy + 40); x.closePath(); x.fill(); x.stroke();
      },
      frame: function (x, clip, px, py, pw, ph) { x.strokeStyle = rainbow(x, px, py, px + pw, py + ph); x.lineWidth = 9; clip(); x.stroke(); }
    }
  };

  /* 신분증 그리기: photo = 이미지/캔버스(없으면 빈 사진 칸), nick = 별명 */
  function draw(cv, info, photo, nick) {
    var T = info.theme, K = DECO[T.key];
    cv.width = W; cv.height = H;
    var x = cv.getContext('2d'); x.textAlign = 'left';
    var R = rng(parseInt(info.no.slice(1), 10) * 97 + info.no.charCodeAt(0));
    K.bg(x, R);
    K.card(x, T, R);

    // 사진
    var tilt = K.shape === 'polaroid', px = 96, py = tilt ? 300 : 290, pw = 320, ph = tilt ? 350 : 390;
    var clip = function () {
      if (K.shape === 'arch') { x.beginPath(); x.moveTo(px, py + ph); x.lineTo(px, py + pw / 2); x.arc(px + pw / 2, py + pw / 2, pw / 2, Math.PI, 0); x.lineTo(px + pw, py + ph); x.closePath(); }
      else { x.beginPath(); x.rect(px, py, pw, ph); }
    };
    x.save();
    if (tilt) {
      x.translate(px + pw / 2, py + ph / 2); x.rotate(-0.04); x.translate(-(px + pw / 2), -(py + ph / 2));
      x.save(); x.shadowColor = 'rgba(0,0,0,.25)'; x.shadowBlur = 16; x.shadowOffsetY = 6; x.fillStyle = '#FFFFFF'; x.fillRect(px - 18, py - 18, pw + 36, ph + 66); x.restore();
    }
    x.save(); clip(); x.clip();
    x.fillStyle = K.shape === 'arch' && T.key === 'gold' ? '#2A2416' : '#DDD3BD'; x.fillRect(px, py, pw, ph);
    if (photo && (photo.width || photo.naturalWidth)) {
      var sw = photo.naturalWidth || photo.width, sh = photo.naturalHeight || photo.height;
      var s = Math.max(pw / sw, ph / sh), dw = sw * s, dh = sh * s;
      x.drawImage(photo, px + (pw - dw) / 2, py + (ph - dh) / 2, dw, dh);
    } else {
      x.fillStyle = T.key === 'gold' ? '#4A3F26' : 'rgba(90,80,60,.35)';
      x.beginPath(); x.arc(px + pw / 2, py + 170, 64, 0, Math.PI * 2); x.fill();
      x.beginPath(); x.ellipse(px + pw / 2, py + ph + 20, 130, 150, 0, Math.PI, 0); x.fill();
      x.fillStyle = T.key === 'gold' ? '#B59A5A' : '#FFFFFF'; x.font = '700 26px ' + FONT; x.textAlign = 'center'; x.fillText('사진', px + pw / 2, py + 180); x.textAlign = 'left';
    }
    x.restore();
    if (tilt) {
      x.fillStyle = '#5A4422'; x.font = '700 22px ' + FONT; x.textAlign = 'center'; x.fillText('사건 담당 요원', px + pw / 2, py + ph + 36); x.textAlign = 'left';
      // 클립
      x.strokeStyle = '#9EA4AE'; x.lineWidth = 7; x.lineCap = 'round';
      x.beginPath(); x.moveTo(px + 230, py + 56); x.lineTo(px + 230, py - 14); x.arc(px + 250, py - 14, 20, Math.PI, 0); x.lineTo(px + 270, py + 44); x.arc(px + 256, py + 44, 14, 0, Math.PI); x.lineTo(px + 242, py - 4); x.stroke();
    }
    x.restore();
    K.frame(x, clip, px, py, pw, ph);

    // 정보
    var ix = 470;
    var field = function (label, value, y, big, color) {
      x.fillStyle = K.sub; x.font = '700 25px ' + FONT; x.fillText(label, ix, y);
      x.fillStyle = color || K.ink; x.font = '800 ' + big + 'px ' + FONT;
      x.fillText(wrap(x, value, W - ix - 110, 1)[0], ix, y + big + 6);
    };
    field('이름', nick || '익명 탐정', 322, 50);
    field('칭호', info.rank, 432, 40, K.rank);
    field('번호 · 난이도', info.no.charAt(0) + '-' + info.no.slice(1) + ' · ' + info.level, 532, 34);
    field('발급일', '2026.' + info.md.slice(0, 2) + '.' + info.md.slice(2), 620, 34);
    // 도장
    x.save(); x.translate(W - 196, 610); x.rotate(-0.22); x.globalAlpha = 0.88; x.strokeStyle = K.stamp; x.fillStyle = K.stamp;
    if (T.key === 'file') {
      x.lineWidth = 6; x.strokeRect(-92, -46, 184, 92); x.lineWidth = 2; x.strokeRect(-82, -36, 164, 72);
      x.font = '800 42px ' + FONT; x.textAlign = 'center'; x.fillText('사건 해결', 0, 15);
    } else {
      x.lineWidth = 6; x.beginPath(); x.arc(0, 0, 74, 0, Math.PI * 2); x.stroke(); x.lineWidth = 2; x.beginPath(); x.arc(0, 0, 62, 0, Math.PI * 2); x.stroke();
      x.font = '800 34px ' + FONT; x.textAlign = 'center';
      if (T.grade === 'rare') { x.font = '800 46px ' + FONT; x.fillText('당첨', 0, 16); } else { x.fillText('사건', 0, -4); x.fillText('해결', 0, 34); }
    }
    x.restore(); x.textAlign = 'left';

    x.strokeStyle = K.line; x.lineWidth = 3; if (T.key === 'file') x.setLineDash([14, 10]);
    x.beginPath(); x.moveTo(96, 726); x.lineTo(W - 96, 726); x.stroke(); x.setLineDash([]);

    var y = 774;
    info.rows.forEach(function (row) {
      x.fillStyle = BADGE[row.b]; x.beginPath(); x.arc(126, y + 8, 30, 0, Math.PI * 2); x.fill();
      x.fillStyle = '#FFFFFF'; x.font = '800 32px ' + FONT; x.textAlign = 'center'; x.fillText(row.b, 126, y + 19); x.textAlign = 'left';
      x.fillStyle = K.sub; x.font = '700 25px ' + FONT; x.fillText(row.label, 182, y + 2);
      x.fillStyle = K.ink; x.font = '500 29px ' + FONT;
      var lines = wrap(x, row.text, W - 182 - 110, 3);
      lines.forEach(function (l, i) { x.fillText(l, 182, y + 42 + i * 38); });
      y += 42 + lines.length * 38 + 26;
    });

    x.textAlign = 'center';
    x.fillStyle = K.ink; x.font = '800 32px ' + FONT; x.fillText('AI와 함께 생각하고, 판단은 스스로', W / 2, H - 124);
    x.fillStyle = K.sub; x.font = '600 23px ' + FONT; x.fillText('2026 부산교육한마당 · 동수영중학교 연구학교관 · ' + info.caseTitle, W / 2, H - 90);
    x.textAlign = 'left';
  }

  return { CASES: CASES, LEVELS: LEVELS, THEMES: THEMES, GRADE_NAME: GRADE_NAME, QB: QB, QC: QC, CIRC: CIRC, DEC: DEC, DEC_SUB: DEC_SUB, DEC_FB: DEC_FB,
    themeOf: themeOf, encode: encode, decode: decode, card: card, draw: draw };
})();
</script>
<script>
/* ===== 휴대폰 신분증 페이지: QR의 결과 코드 + 내 셀카 → 신분증 이미지 ===== */
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  window.addEventListener('hashchange', function () { location.reload(); });
  var r = QHC.decode(location.hash);
  if (!r) { $('bad').hidden = false; return; }
  var info = QHC.card(r), photo = null, timer = null;
  $('ok').hidden = false;
  $('theme').innerHTML = '등급: <b>' + info.gradeName + '</b> · 디자인: <b>' + info.theme.name + '</b>' + (info.grade === 'rare' ? ' <span class="rare">당첨!</span>' : '') + '<br>같이 온 친구는 어떤 신분증이 나왔나요?';
  var framed = false; try { framed = window.self !== window.top; } catch (e) { framed = true; }
  if (!framed) $('dl').hidden = false;

  function redraw() {
    QHC.draw($('cv'), info, photo, $('nick').value.trim());
    $('final').src = $('cv').toDataURL('image/png');
  }
  $('nick').addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(redraw, 250); });
  $('file').addEventListener('change', function () {
    var f = this.files && this.files[0]; if (!f) return;
    var url = URL.createObjectURL(f), img = new Image();
    img.onload = function () {
      var s = Math.min(1, 900 / Math.max(img.naturalWidth, img.naturalHeight));
      var c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); photo = c;
      $('shotLabel').textContent = '다시 찍기'; $('clearPhoto').hidden = false; redraw();
    };
    img.onerror = function () { URL.revokeObjectURL(url); alertBox('사진을 불러오지 못했어요. 다시 찍어 주세요.'); };
    img.src = url; this.value = '';
  });
  $('clearPhoto').addEventListener('click', function () { photo = null; $('shotLabel').textContent = '셀카 찍기'; this.hidden = true; redraw(); });
  $('dl').addEventListener('click', function () {
    var a = document.createElement('a'); a.href = $('cv').toDataURL('image/png'); a.download = '탐정신분증_' + r.no + '.png';
    document.body.appendChild(a); a.click(); a.remove();
  });
  function alertBox(t) { $('saveHint').textContent = t; }
  redraw();
})();
</script>
