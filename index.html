html,body{margin:0}

label.lab{font-weight:700;font-size:.95rem;display:block;margin-bottom:6px}

:focus-visible{outline:3px solid var(--q);outline-offset:2px}
.theme{margin-top:6px;font-size:.95rem;color:var(--muted)}
.theme b{color:var(--ink)}

    x.textAlign = 'center';
    x.fillStyle = K.ink; x.font = '800 32px ' + FONT; x.fillText('AI와 함께 생각하고, 판단은 스스로', W / 2, H - 124);
    x.fillStyle = K.sub; x.font = '600 23px ' + FONT; x.fillText('2026 부산교육한마당 · 동수영중학교 연구학교관 · ' + info.caseTitle, W / 2, H - 90);
    x.textAlign = 'left';
  }

  return { CASES: CASES, LEVELS: LEVELS, THEMES: THEMES, GRADE_NAME: GRADE_NAME, QB: QB, QC: QC, CIRC: CIRC, DEC: DEC, DEC_FB: DEC_FB,
    themeOf: themeOf, encode: encode, decode: decode, card: card, draw: draw };
})();
</script>
<script>
/* ===== 휴대폰 신분증 페이지: QR의 결과 코드 + 내 셀카 → 신분증 이미지 ===== */
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  window.addEventListener('hashchange', function () { location.reload(); });
  var r = QHC.decode(location.hash);
  if (!r) { $('bad').hidden = false; return; }
  var info = QHC.card(r), photo = null, timer = null;
  $('ok').hidden = false;
  $('theme').innerHTML = '등급: <b>' + info.gradeName + '</b> · 디자인: <b>' + info.theme.name + '</b>' + (info.grade === 'rare' ? ' <span class="rare">당첨!</span>' : '') + '<br>같이 온 친구는 어떤 신분증이 나왔나요?';
  var framed = false; try { framed = window.self !== window.top; } catch (e) { framed = true; }
  if (!framed) $('dl').hidden = false;

  function redraw() {
    QHC.draw($('cv'), info, photo, $('nick').value.trim());
    $('final').src = $('cv').toDataURL('image/png');
  }
  $('nick').addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(redraw, 250); });
  $('file').addEventListener('change', function () {
    var f = this.files && this.files[0]; if (!f) return;
    var url = URL.createObjectURL(f), img = new Image();
    img.onload = function () {
      var s = Math.min(1, 900 / Math.max(img.naturalWidth, img.naturalHeight));
      var c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); photo = c;
      $('shotLabel').textContent = '다시 찍기'; $('clearPhoto').hidden = false; redraw();
    };
    img.onerror = function () { URL.revokeObjectURL(url); alertBox('사진을 불러오지 못했어요. 다시 찍어 주세요.'); };
    img.src = url; this.value = '';
  });
  $('clearPhoto').addEventListener('click', function () { photo = null; $('shotLabel').textContent = '셀카 찍기'; this.hidden = true; redraw(); });
  $('dl').addEventListener('click', function () {
    var a = document.createElement('a'); a.href = $('cv').toDataURL('image/png'); a.download = '탐정신분증_' + r.no + '.png';
    document.body.appendChild(a); a.click(); a.remove();
  });
  function alertBox(t) { $('saveHint').textContent = t; }
  redraw();
})();
</script>
</body></html>
